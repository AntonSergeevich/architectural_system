# Копировать в /etc/nginx/sites-available/dades
#   sudo ln -s /etc/nginx/sites-available/dades /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сначала поднимаем БЕЗ блока TLS (только 80-й порт), получаем сертификат
# через certbot — он сам допишет 443 и редирект.
#

upstream dades_app {
    server unix:/run/dades/gunicorn.sock fail_timeout=0;
}

# --- Ограничение частоты ----------------------------------------------------
# Считаем только отправку форм, а не их открытие. Это не мелочь: страница
# входа отдавалась по тому же лимиту, что и попытки входа, — и заказчик,
# перешедший по ссылке от Дарьи, получал от nginx голое «503 Service
# Temporarily Unavailable». Для него это «сайт лёг», а на деле сайт работал.
#
# Ловить перебор паролей нужно на POST: смотреть страницу входа не вредно
# никому. Пустой ключ выключает лимит для запроса — поэтому для всех
# методов, кроме POST, ключ пустой.
map $request_method $dades_post_ip {
    POST     $binary_remote_addr;
    default  "";
}

# Отправка заявки и согласие на куки.
limit_req_zone $dades_post_ip zone=dades_forms:10m rate=20r/m;
# Попытки входа и восстановления пароля. Двадцать в минуту с одного адреса
# — это не перебор, а семья с одного вайфая; перебор начинается тысячами.
limit_req_zone $dades_post_ip zone=dades_login:10m rate=20r/m;

# Отбитый запрос — это «слишком часто», а не «сервис недоступен». Код 429
# говорит это и человеку, и поисковику, который иначе решит, что сайт лежит.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name da-des.ru www.da-des.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://da-des.ru$request_uri; }
}

server {
    # Отдельная директива «http2 on» появилась только в nginx 1.25, а в
    # Ubuntu 24.04 приезжает 1.24 — с ней конфиг просто не стартует.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.da-des.ru;

    ssl_certificate     /etc/letsencrypt/live/da-des.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/da-des.ru/privkey.pem;

    return 301 https://da-des.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name da-des.ru;

    ssl_certificate     /etc/letsencrypt/live/da-des.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/da-des.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    charset utf-8;
    client_max_body_size 32M;   # визуализации и чертежи бывают тяжёлыми

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Страница на случай, когда лимит всё-таки сработал: человеку нужно
    # знать, что делать дальше, а не читать «Service Temporarily
    # Unavailable» на английском.
    error_page 429 /_429.html;
    location = /_429.html {
        root /srv/dades/deploy;
        internal;
        charset utf-8;
    }

    location /static/ {
        alias /srv/dades/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/dades/media/;
        expires 7d;
        access_log off;
    }

    # Уведомление об оплате приходит со стороны платёжного сервиса — под
    # общий лимит на формы его подводить нельзя, иначе часть уведомлений
    # будет отброшена и счета останутся неоплаченными.
    location = /pay/getplatinum/callback/ {
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вебхук Telegram. Под лимит его подводить нельзя: бот пришлёт
    # обновление один раз, и отброшенное «подключите уведомления»
    # выглядит как сломанная кнопка в кабинете.
    location ~ ^/accounts/telegram/ {
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вход и восстановление пароля — самое жёсткое ограничение.
    location ~ ^/accounts/(vhod|parol)/ {
        limit_req zone=dades_login burst=10 nodelay;
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Публичные формы: заявка и согласие на куки.
    location ~ ^/(kontakty|cookies)/ {
        limit_req zone=dades_forms burst=10 nodelay;
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Кабинет НЕ лимитируем. Он за паролем, а работа в нём — это десятки
    # запросов подряд: отметить задачи, записать оплаты, ответить в чате.
    # Ограничение в двадцать запросов в минуту здесь означало бы, что
    # система спорит с тем, кто в ней работает.

    location / {
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
