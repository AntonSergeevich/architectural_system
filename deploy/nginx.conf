# Копировать в /etc/nginx/sites-available/darya
#   sudo ln -s /etc/nginx/sites-available/darya /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сначала поднимаем БЕЗ блока TLS (только 80-й порт), получаем сертификат
# через certbot — он сам допишет 443 и редирект.
#
# ЗАМЕНИТЬ example.ru на реальный домен во всех местах.

upstream darya_app {
    server unix:/run/darya/gunicorn.sock fail_timeout=0;
}

# Лимит на формы: защищает от перебора заявок и подбора пароля.
limit_req_zone $binary_remote_addr zone=darya_forms:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.ru$request_uri; }
}

server {
    # Отдельная директива «http2 on» появилась только в nginx 1.25, а в
    # Ubuntu 24.04 приезжает 1.24 — с ней конфиг просто не стартует.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    return 301 https://example.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    charset utf-8;
    client_max_body_size 32M;   # визуализации и чертежи бывают тяжёлыми

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location /static/ {
        alias /srv/darya/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/darya/media/;
        expires 7d;
        access_log off;
    }

    # Уведомление об оплате приходит со стороны платёжного сервиса — под
    # общий лимит на формы его подводить нельзя, иначе часть уведомлений
    # будет отброшена и счета останутся неоплаченными.
    location = /pay/getplatinum/callback/ {
        proxy_pass http://darya_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(kontakty|cabinet|accounts|admin)/ {
        limit_req zone=darya_forms burst=10 nodelay;
        proxy_pass http://darya_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://darya_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
