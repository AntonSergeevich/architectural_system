# Копировать в /etc/nginx/sites-available/dades
#   sudo ln -s /etc/nginx/sites-available/dades /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сначала поднимаем БЕЗ блока TLS (только 80-й порт), получаем сертификат
# через certbot — он сам допишет 443 и редирект.
#

upstream dades_app {
    server unix:/run/dades/gunicorn.sock fail_timeout=0;
}

# Лимит на публичные формы: защита от спама заявками.
limit_req_zone $binary_remote_addr zone=dades_forms:10m rate=20r/m;
# Отдельный, более жёсткий — на вход и восстановление пароля. Это
# единственное место, где перебор вообще имеет смысл.
limit_req_zone $binary_remote_addr zone=dades_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name da-des.ru www.da-des.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://da-des.ru$request_uri; }
}

server {
    # Отдельная директива «http2 on» появилась только в nginx 1.25, а в
    # Ubuntu 24.04 приезжает 1.24 — с ней конфиг просто не стартует.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.da-des.ru;

    ssl_certificate     /etc/letsencrypt/live/da-des.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/da-des.ru/privkey.pem;

    return 301 https://da-des.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name da-des.ru;

    ssl_certificate     /etc/letsencrypt/live/da-des.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/da-des.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    charset utf-8;
    client_max_body_size 32M;   # визуализации и чертежи бывают тяжёлыми

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location /static/ {
        alias /srv/dades/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/dades/media/;
        expires 7d;
        access_log off;
    }

    # Уведомление об оплате приходит со стороны платёжного сервиса — под
    # общий лимит на формы его подводить нельзя, иначе часть уведомлений
    # будет отброшена и счета останутся неоплаченными.
    location = /pay/getplatinum/callback/ {
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вебхук Telegram. Под лимит его подводить нельзя: бот пришлёт
    # обновление один раз, и отброшенное «подключите уведомления»
    # выглядит как сломанная кнопка в кабинете.
    location ~ ^/accounts/telegram/ {
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вход и восстановление пароля — самое жёсткое ограничение.
    location ~ ^/accounts/(vhod|parol)/ {
        limit_req zone=dades_login burst=5 nodelay;
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Публичные формы: заявка и согласие на куки.
    location ~ ^/(kontakty|cookies)/ {
        limit_req zone=dades_forms burst=10 nodelay;
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Кабинет НЕ лимитируем. Он за паролем, а работа в нём — это десятки
    # запросов подряд: отметить задачи, записать оплаты, ответить в чате.
    # Ограничение в двадцать запросов в минуту здесь означало бы, что
    # система спорит с тем, кто в ней работает.

    location / {
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
