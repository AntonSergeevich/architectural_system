# Временный конфиг: только 80-й порт, без TLS.
#
# Нужен ровно на один шаг установки. Боевой конфиг (nginx.conf) ссылается
# на файлы сертификата, которых до выпуска ещё нет, — nginx с ним просто
# не стартует. Поэтому сначала поднимаем сайт по HTTP, выпускаем
# сертификат, и только потом кладём боевой конфиг.
#
#   sudo cp deploy/nginx-http.conf /etc/nginx/sites-available/dades
#   sudo nginx -t && sudo systemctl restart nginx
#
# Заодно это честная проверка связки nginx + gunicorn до всякого HTTPS:
# если тут сайт открывается, дальше остаётся только сертификат.

upstream dades_app {
    server unix:/run/dades/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name da-des.ru www.da-des.ru;

    charset utf-8;
    client_max_body_size 32M;

    # Каталог, куда certbot кладёт файл-подтверждение владения доменом.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /srv/dades/staticfiles/;
        access_log off;
    }

    location /media/ {
        alias /srv/dades/media/;
        access_log off;
    }

    location / {
        proxy_pass http://dades_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
